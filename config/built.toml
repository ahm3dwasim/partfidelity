[[summary]]
name = "What it does"
text = "Turns one repair video you filmed or have the right to share into an illustrated step-by-step guide, with safety hard stops for batteries and glued parts."
[[summary]]
name = "Meta models"
text = "Muse Spark extracts the steps. SAM 3.1 finds the fan and battery. Spark Open gives a background second opinion on part labels."
[[summary]]
name = "Live now"
text = "The site runs on Modal. One real sample guide, made from one laptop repair, is open to everyone; you can make your own from a clip of up to 5 minutes."
[[summary]]
name = "Honest limits"
text = "Only the fan and battery are outlined. Step times are approximate. The sample comes from a single repair, so this shows a working pipeline, not measured accuracy."

[[tools]]
name = "Muse Spark"
text = "Extracts repair steps from video and checks uncertain labels."
[[tools]]
name = "SAM 3.1"
text = "Finds the fan and battery in selected video frames and scores each find."
[[tools]]
name = "SAM 3 (open weights)"
text = "The sample guide's part outlines are traced by open-weights SAM 3 from the SAM 3.1 boxes; the outlines ship with the sample."
[[tools]]
name = "Muse Spark Open"
text = "Open-weights second opinion on each part label, served on Baseten. It runs in the background and never changes a label; a disagreement flags the label for a person to review. Its agreements are shown on the call receipts; no accuracy is claimed for it."
[[tools]]
name = "Muse Image"
text = "The live app makes no Muse Image call. Muse Image edits of the pre-event repair clip, used with permission, were made offline and frozen as a test set for the edit check (the ten edits on 26 Oct 2026; the gate was run on them on 29 Oct 2026), which compares an edited frame with its original using the SAM outline overlap and masked image similarity. The check is not part of the live app; its recorded results are on the catch page as a controlled demonstration, not an accuracy figure."

