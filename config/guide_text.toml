verdict_hard_battery_unknown_hazard = "Hard: only if you can safely disconnect a laptop battery. A second hazard in this guide could not be identified, so stop and check before you start."
verdict_hard_glued_screen_unknown_hazard = "Hard: only if you can safely heat and lift a glued screen. A second hazard in this guide could not be identified, so stop and check before you start."
verdict_hard_battery_glued_screen_unknown_hazard = "Hard: only if you can safely lift a glued screen and disconnect the battery. A third hazard in this guide could not be identified, so stop and check before you start."
