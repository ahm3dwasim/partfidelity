# keyframes [t, x1, y1, ..., x4, y4] every 0.25 s from tracked label positions (3 px margin), held 0.1 s past each end.
# The Windows / Device Manager screen: the whole frame becomes the panel. Per-frame analysis of the original clip (30 fps) puts the
# last laptop-lid frame at 179.067 s and the hard cut to the screen at 179.100 s (frame 5373; mean frame difference 66, motion is under 3).
# The span starts at 179.0 s, 3 frames before that cut (verify_clip needs 2), and runs past the clip's end (189.23 s, last frame 189.2 s).
[[clip_hide]]
start_s = 179.0
end_s = 189.3

