# What tools/redact_sample.py hides in the public sample.
# Each region hugs one identifying element and nothing else. A still region is [x, y, w, h] or a quad of eight numbers
# [x1, y1, ..., x4, y4] (pixels of its own file); loader: tools/redactions.py (strict).
# Part-N thumbnails (labels/*.png) are not listed: the tool redacts each from its frame and keeps its badge.

[style]
blur_sigma = 30.0               # strong enough that a barcode or serial is unreadable at 4x zoom
panel_rgb = [52, 56, 62]        # the plain panel that replaces a screen
caption_rgb = [235, 238, 242]
caption = "Screen hidden for privacy"
caption_width_fraction = 0.5
caption_margin_px = 12          # clear border around the caption text; outside it every pixel must be the panel colour
panel_noise_tolerance = 6       # max per-channel codec noise outside the caption box; the real rebuilt clip measures 0 over 307 hidden frames
webp_quality = 90

