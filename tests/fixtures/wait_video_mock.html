<!doctype html>
<!-- Test-only harness for the wait-video race paths (never shipped as a page):
     mounts the real static/ui/wait-video.js with mocked fetch, image loading,
     and timers, so browser tests can step stale polls, load failure/retry,
     pending-frame repeats, clock cleanup/replay, and the cancel-vs-done race
     deterministically through the window.__wv driver. ?mode=live (default)
     polls the mocked status/cancel endpoints; ?mode=script plays a fixed
     fake status script on the manual clock. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wait-video mock harness (test only)</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/ui/wait-video.css">
<script>window.__WV_FAKE__ = 1;</script>
</head>
<body style="margin:0;background:#131313">
<section class="wv" id="wait-video" data-status-url="" data-cancel-url=""
         aria-label="Guide progress">
  <div class="wv-grid">
    <div class="wv-viewer">
      <div class="wv-frame" id="wv-frame">
        <img class="wv-img is-on" id="wv-img-a" alt="">
        <img class="wv-img" id="wv-img-b" alt="" aria-hidden="true">
        <svg class="wv-overlay" id="wv-overlay" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
        <p class="wv-loading" id="wv-loading">Loading your frames…</p>
      </div>
      <div class="wv-viewbar">
        <p class="wv-clock">Elapsed <span id="wv-clock" role="timer">0:00</span></p>
        <ol class="wv-stages" id="wv-stages" aria-live="polite"></ol>
      </div>
    </div>
    <aside class="wv-rail" aria-label="Finished steps">
      <div class="wv-actions">
        <button class="wv-cancel" id="wv-cancel" type="button">Cancel and delete</button>
        <a class="wv-guide is-hidden" id="wv-guide" href="#">Open your guide</a>
      </div>
      <p class="wv-note" id="wv-note" role="status"></p>
      <ol class="wv-steps" id="wv-steps"></ol>
      <button class="wv-replay is-hidden" id="wv-replay" type="button">Replay demo</button>
    </aside>
  </div>
</section>
<script src="/static/ui/wait-video.js"></script>
<script>
(function () {
  "use strict";

  // ---- manual clock: Date.now plus setTimeout/setInterval ----
  var now = 0;
  var nextId = 1;
  var timers = {};
  Date.now = function () { return now; };
  window.setTimeout = function (fn, ms) {
    var id = nextId++;
    timers[id] = { fn: fn, ms: ms || 0, next: now + (ms || 0), repeat: false };
    return id;
  };
  window.setInterval = function (fn, ms) {
    var id = nextId++;
    timers[id] = { fn: fn, ms: ms || 0, next: now + (ms || 0), repeat: true };
    return id;
  };
  window.clearTimeout = function (id) { delete timers[id]; };
  window.clearInterval = function (id) { delete timers[id]; };
  function tick(ms) {
    var end = now + ms;
    var guard = 0;
    for (;;) {
      var dueId = 0;
      var dueNext = Infinity;
      for (var id in timers) {
        if (timers[id].next <= end && timers[id].next < dueNext) {
          dueNext = timers[id].next;
          dueId = id;
        }
      }
      if (!dueId || ++guard > 100000) break;
      now = dueNext;
      var t = timers[dueId];
      if (t.repeat) t.next += t.ms;
      else delete timers[dueId];
      t.fn();
    }
    now = end;
    return now;
  }

  // ---- fetch stub: every request parks until the test releases it ----
  var calls = [];
  var parked = [];
  window.fetch = function (url, opts) {
    var entry = {
      url: String(url),
      method: (opts && opts.method) || "GET",
      resolve: null,
      reject: null,
      settled: false,
    };
    calls.push({ url: entry.url, method: entry.method });
    parked.push(entry);
    var promise = new Promise(function (res, rej) {
      entry.resolve = res;
      entry.reject = rej;
    });
    if (opts && opts.signal) {
      opts.signal.addEventListener("abort", function () {
        if (entry.settled) return;
        entry.settled = true;
        var err = new Error("aborted");
        err.name = "AbortError";
        entry.reject(err);
      });
    }
    return promise;
  };
  function respond(i, ok, body) {
    var e = parked[i];
    if (!e || e.settled) return false;
    e.settled = true;
    e.resolve({
      ok: ok,
      status: ok ? 200 : 500,
      json: function () { return Promise.resolve(body); },
    });
    return true;
  }
  function fail(i, name) {
    var e = parked[i];
    if (!e || e.settled) return false;
    e.settled = true;
    var err = new Error(name || "boom");
    err.name = name || "Error";
    e.reject(err);
    return true;
  }

  // ---- image stub: src sets park until the test fires load/error ----
  var srcSets = [];
  ["wv-img-a", "wv-img-b"].forEach(function (id) {
    var img = document.getElementById(id);
    var current = "";
    Object.defineProperty(img, "src", {
      configurable: true,
      get: function () { return current; },
      set: function (v) {
        current = String(v);
        srcSets.push({ id: id, src: current });
      },
    });
  });
  function fireImg(id, which) {
    var img = document.getElementById(id);
    var handler = which === "load" ? img.onload : img.onerror;
    if (typeof handler === "function") handler.call(img);
    return typeof handler === "function";
  }

  // ---- mount the real component on the mocks ----
  var SYN = "/static/ui/media/wait-video/";
  var q = new URLSearchParams(window.location.search);
  var root = document.getElementById("wait-video");
  var app;
  if ((q.get("mode") || "live") === "script") {
    app = WaitVideo.mount(root, { fakeScript: [
      { at: 0, status: { state: "active",
        stages: [{ id: "reading", label: "Reading video", state: "active" }],
        frame: { id: "s09", src: SYN + "synth-s09.jpg" },
        steps: [{ n: 1, title: "Open the lid", at: "0:12",
                  thumb: SYN + "synth-s09.jpg" }] } },
      { at: 5, status: { state: "active",
        stages: [{ id: "reading", label: "Reading video", state: "done" },
                 { id: "naming", label: "Naming steps", state: "active" }],
        frame: { id: "s12", src: SYN + "synth-s12.jpg" },
        steps: [{ n: 1, title: "Open the lid", at: "0:12",
                  thumb: SYN + "synth-s09.jpg" },
                { n: 2, title: "Remove the back cover", at: "1:01",
                  thumb: SYN + "synth-s12.jpg" }] } },
      { at: 10, status: { state: "done",
        stages: [{ id: "reading", label: "Reading video", state: "done" },
                 { id: "naming", label: "Naming steps", state: "done" }],
        frame: { id: "s12", src: SYN + "synth-s12.jpg" },
        steps: [{ n: 1, title: "Open the lid", at: "0:12",
                  thumb: SYN + "synth-s09.jpg" },
                { n: 2, title: "Remove the back cover", at: "1:01",
                  thumb: SYN + "synth-s12.jpg" }],
        guide_url: "#guide-ready" } },
    ] });
  } else {
    app = WaitVideo.mount(root, {
      statusUrl: "/__wv/status",
      cancelUrl: "/__wv/cancel",
    });
  }

  window.__wv = {
    tick: tick,
    calls: function () { return calls.slice(); },
    parked: function () {
      return parked.map(function (e, i) {
        return { i: i, url: e.url, method: e.method, settled: e.settled };
      });
    },
    respond: respond,
    fail: fail,
    srcSets: function () { return srcSets.slice(); },
    imgLoad: function (id) { return fireImg(id, "load"); },
    imgError: function (id) { return fireImg(id, "error"); },
    state: function () {
      return {
        frameId: app.frameId,
        pendingFrameId: app.pendingFrameId,
        lastRevision: app.lastRevision,
        terminal: app.terminal,
        pollSeq: app.pollSeq,
        tickOn: app.tick !== null,
        note: app.note.textContent,
        clock: app.clock.textContent,
        cancelDisabled: app.cancelBtn.disabled,
        cancelHidden: app.cancelBtn.classList.contains("is-hidden"),
        guideHidden: app.guideLink.classList.contains("is-hidden"),
        loadingHidden: app.loading.classList.contains("is-hidden"),
        steps: app.steps.children.length,
        stages: [app.stages.children.length,
                 app.stages.textContent],
      };
    },
  };
})();
</script>
</body>
</html>
